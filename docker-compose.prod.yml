version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: whitefox-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whitefox_prod}
      POSTGRES_USER: ${POSTGRES_USER:-whitefox_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./infrastructure/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whitefox_user} -d ${POSTGRES_DB:-whitefox_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: whitefox-redis-prod
    restart: always
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    container_name: whitefox-redpanda-prod
    restart: always
    command:
      - redpanda
      - start
      - --mode dev-container
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda_prod_data:/var/lib/redpanda/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whitefox-backend-prod
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-whitefox_prod}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-whitefox_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Required POSTGRES_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      JWT_SECRET: ${JWT_SECRET:?Required JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: whitefox-frontend-prod
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.whitefoxlaundry.com/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api.whitefoxlaundry.com/ws}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://whitefoxlaundry.com}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Required NEXTAUTH_SECRET}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  postgres_prod_data:
  redis_prod_data:
  redpanda_prod_data:
